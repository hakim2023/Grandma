<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14506b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>My Medicines</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f9;--fg:#10222b;--card:#fff;--line:#c9d6dd;--blue:#14506b;--green:#1c8a4a;--gbg:#c9f0d6;--amber:#f2a900;--abg:#fff3cf;--mut:#4d6672;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a21;--fg:#eef5f8;--card:#16272f;--line:#2c4450;--blue:#7cc4e4;--green:#4fd187;--gbg:#14402a;--abg:#4a3a0a;--mut:#9db4bf}}
:root[data-theme="dark"]{--bg:#0d1a21;--fg:#eef5f8;--card:#16272f;--line:#2c4450;--blue:#7cc4e4;--green:#4fd187;--gbg:#14402a;--abg:#4a3a0a;--mut:#9db4bf}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:22px;line-height:1.3;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:28px;margin:0}
.gear{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:26px;color:var(--fg)}
button{font:inherit;cursor:pointer}
.big{display:block;width:100%;min-height:92px;border:0;border-radius:24px;font-size:30px;font-weight:700;color:#fff;background:var(--green);margin-top:14px}
.big.blue{background:#14506b}
.big:active{transform:scale(.98)}
.home{text-align:center;padding-top:7vh}
.home .ic{font-size:96px}
.home p{color:var(--mut);font-size:24px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.row .ic{font-size:34px;width:48px;text-align:center}
.row b{display:block;font-size:22px}
.row small{color:var(--mut);font-size:19px}
.row.done{background:var(--gbg);border-color:var(--green)}
.row.done .st{color:var(--green);font-size:40px;margin-left:auto;font-weight:700}
.row .st{margin-left:auto;font-size:20px;color:var(--mut);text-align:right}
.card{background:var(--abg);border:4px solid var(--amber);border-radius:28px;padding:18px;margin-bottom:12px;text-align:center}
.card .t{font-size:30px;font-weight:700}
.card .s{font-size:21px;color:var(--mut);margin-bottom:8px}
.card img{width:100%;max-height:260px;object-fit:contain;border-radius:18px;background:#fff;margin:6px 0}
.card .pill{font-size:120px;line-height:1.1}
.card.pulse{animation:p 1.4s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 0 10px rgba(242,169,0,.35)}}
@media (prefers-reduced-motion:reduce){.card.pulse{animation:none}}
.win{text-align:center;padding:30px 10px;font-size:34px;font-weight:700;color:var(--green)}
.win .ic{font-size:100px}
#set{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#set .in{max-width:560px;margin:0 auto}
.m{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}
.m input[type=text],select{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.m .ph{display:flex;align-items:center;gap:12px;margin-top:10px}
.m img{width:84px;height:84px;object-fit:cover;border-radius:12px;background:#fff}
.m label.b{display:inline-block;padding:12px 16px;border-radius:12px;background:var(--blue);color:var(--bg);font-weight:700}
.m input[type=file]{display:none}
.note{font-size:18px;color:var(--mut);margin:8px 0}
.sm{padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:100%;margin-top:8px;font-size:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="set"></div>
<script>
var OFF=[0,5,15,45,65],KIND=['m','m','m','eat','m'],MI=[0,1,2,-1,3];
var T={
en:{title:'My Medicines',start:'START',startSub:'Press to show the first medicine',med:'Medicine',bef:'Take before eating',aft:'Take after eating',eat:'Time to eat',took:'I TOOK IT ✔',eating:'I AM EATING ✔',inn:'in',min:'min',allDone:'All done. Well done!',fin:'FINISH',set:'Settings',name:'Name',photo:'Add photo',lang:'Language',close:'CLOSE',stop:'Stop routine',meal:'Eating at',note:'For the helper: add a name and a photo of each medicine. Keep this app open and the volume on while the routine runs.',now:'Now'},
fr:{title:'Mes médicaments',start:'COMMENCER',startSub:'Appuyez pour voir le premier médicament',med:'Médicament',bef:'À prendre avant le repas',aft:'À prendre après le repas',eat:'C’est l’heure de manger',took:'JE L’AI PRIS ✔',eating:'JE MANGE ✔',inn:'dans',min:'min',allDone:'Tout est fait. Bravo !',fin:'TERMINER',set:'Réglages',name:'Nom',photo:'Ajouter une photo',lang:'Langue',close:'FERMER',stop:'Arrêter',meal:'Repas à',note:'Pour l’aidant : ajoutez un nom et une photo pour chaque médicament. Gardez l’application ouverte, son activé.',now:'Maintenant'},
ar:{title:'أدويتي',start:'ابدأ',startSub:'اضغطي لعرض الدواء الأول',med:'الدواء',bef:'يؤخذ قبل الأكل',aft:'يؤخذ بعد الأكل',eat:'وقت الأكل',took:'أخذته ✔',eating:'أنا آكل ✔',inn:'بعد',min:'د',allDone:'انتهى كل شيء. أحسنتِ!',fin:'إنهاء',set:'الإعدادات',name:'الاسم',photo:'إضافة صورة',lang:'اللغة',close:'إغلاق',stop:'إيقاف',meal:'الأكل على',note:'للمساعد: أضف اسما وصورة لكل دواء. أبقِ التطبيق مفتوحا والصوت شغالا.',now:'الآن'}
};
var S={};try{S=JSON.parse(localStorage.getItem('pb'))||{}}catch(e){}
S.meds=S.meds||[{n:'',p:''},{n:'',p:''},{n:'',p:''},{n:'',p:''}];
S.al=S.al||[];S.done=S.done||[];
S.lang=S.lang||(navigator.language||'en').slice(0,2);if(!T[S.lang])S.lang='en';
function save(){try{localStorage.setItem('pb',JSON.stringify(S))}catch(e){}}
function t(k){return T[S.lang][k]}
function hm(ms){return new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function mname(i){var m=S.meds[MI[i]];return m.n||(t('med')+' '+(MI[i]+1))}
function sub(i){return KIND[i]=='eat'?t('eat'):(i==4?t('aft'):t('bef'))}
var AC=null,last='';
function unlock(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function beep(){try{if(!AC)return;[0,.35,.7].forEach(function(d){var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.4,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.28);o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.3)})}catch(e){}if(navigator.vibrate)navigator.vibrate([400,200,400])}
function notify(i){beep();try{if(window.Notification&&Notification.permission=='granted')new Notification(KIND[i]=='eat'?t('eat'):mname(i),{body:sub(i),requireInteraction:true})}catch(e){}}
var wl=null;function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(S.start&&document.visibilityState=='visible')wake()});
function html(){
 var h='<header><h1>'+t('title')+'</h1><button class="gear" data-a="set" aria-label="'+t('set')+'">⚙</button></header>';
 if(!S.start)return h+'<div class="home"><div class="ic">💊</div><p>'+t('startSub')+'</p><button class="big" data-a="start">'+t('start')+'</button></div>';
 var now=Date.now(),all=true,rows='',cards='';
 for(var i=0;i<5;i++){
  var due=S.start+OFF[i]*60000,eat=KIND[i]=='eat',ic=eat?'🍽️':'💊';
  if(S.done[i]){rows+='<div class="row done"><span class="ic">'+ic+'</span><span><b>'+(eat?t('eat'):mname(i))+'</b><small>'+hm(due)+'</small></span><span class="st">✔</span></div>';continue}
  all=false;
  if(now>=due){
   var p=eat?'<div class="pill">🍽️</div>':(S.meds[MI[i]].p?'<img alt="" src="'+S.meds[MI[i]].p+'">':'<div class="pill">💊</div>');
   cards+='<div class="card pulse"><div class="t">'+(eat?t('eat'):mname(i))+'</div><div class="s">'+sub(i)+'</div>'+p+'<button class="big" data-a="ok" data-i="'+i+'">'+(eat?t('eating'):t('took'))+'</button></div>';
  }else{
   var m=Math.ceil((due-now)/60000);
   rows+='<div class="row"><span class="ic">'+ic+'</span><span><b>'+(eat?t('eat'):mname(i))+'</b><small>'+hm(due)+'</small></span><span class="st">'+t('inn')+' '+m+' '+t('min')+'</span></div>';
  }
 }
 if(all)return h+rows+'<div class="win"><div class="ic">🎉</div>'+t('allDone')+'</div><button class="big blue" data-a="fin">'+t('fin')+'</button>';
 return h+cards+rows;
}
function render(){document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';document.documentElement.lang=S.lang;var h=html();if(h!==last){last=h;document.getElementById('app').innerHTML=h}}
function tick(){
 if(S.start){var now=Date.now(),any=false;
  for(var i=0;i<5;i++){if(S.done[i])continue;if(now>=S.start+OFF[i]*60000){any=true;if(!S.al[i]){S.al[i]=1;save();notify(i)}}}
  if(any&&Math.floor(now/1000)%15==0)beep();}
 if(document.getElementById('set').style.display!='block')render();
}
setInterval(tick,1000);
document.addEventListener('click',unlock,true);
document.getElementById('app').addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a=='set')openSet();
 if(a=='start'){unlock();wake();try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(x){}S.start=Date.now();S.done=[];S.al=[];save();last='';tick()}
 if(a=='ok'){S.done[+b.dataset.i]=true;save();last='';render()}
 if(a=='fin'){S.start=0;S.done=[];S.al=[];save();last='';render()}
});
function shrink(file,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)}
function openSet(){
 var el=document.getElementById('set'),h='<div class="in"><h1>⚙ '+t('set')+'</h1><p class="note">'+t('note')+'</p>';
 for(var i=0;i<4;i++){var m=S.meds[i];h+='<div class="m"><input type="text" data-n="'+i+'" placeholder="'+t('med')+' '+(i+1)+'" value="'+(m.n||'').replace(/"/g,'&quot;')+'"><div class="ph">'+(m.p?'<img alt="" src="'+m.p+'">':'<span style="font-size:48px">💊</span>')+'<label class="b">'+t('photo')+'<input type="file" accept="image/*" data-p="'+i+'"></label></div></div>'}
 h+='<div class="m">'+t('lang')+'<select id="lg"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select></div>';
 if(S.start)h+='<button class="sm" id="stp">'+t('stop')+'</button>';
 h+='<button class="big blue" id="cl">'+t('close')+'</button></div>';
 el.innerHTML=h;el.style.display='block';document.getElementById('lg').value=S.lang;
 el.querySelectorAll('[data-n]').forEach(function(x){x.oninput=function(){S.meds[+x.dataset.n].n=x.value;save()}});
 el.querySelectorAll('[data-p]').forEach(function(x){x.onchange=function(){if(x.files[0])shrink(x.files[0],function(d){S.meds[+x.dataset.p].p=d;save();openSet()})}});
 document.getElementById('lg').onchange=function(){S.lang=this.value;save();openSet()};
 var s=document.getElementById('stp');if(s)s.onclick=function(){S.start=0;S.done=[];S.al=[];save();openSet()};
 document.getElementById('cl').onclick=function(){el.style.display='none';last='';render()};
}
try{var ic='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#14506b"/><text x="256" y="350" font-size="280" text-anchor="middle">💊</text></svg>');
var mf={name:'My Medicines',short_name:'Medicines',start_url:'.',display:'standalone',background_color:'#f3f7f9',theme_color:'#14506b',icons:[{src:ic,sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
var l=document.createElement('link');l.rel='manifest';l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(mf));document.head.appendChild(l)}catch(e){}
render();if(S.start)wake();
</script>
</body>
</html>
