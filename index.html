<title>أدويتي</title>
<style>
:root{--bg:#f3f7f9;--fg:#10222b;--card:#fff;--line:#c9d6dd;--green:#1c8a4a;--gbg:#c9f0d6;--amber:#f2a900;--abg:#fff3cf;--mut:#4d6672;--red:#d62828;--blue:#14506b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a21;--fg:#eef5f8;--card:#16272f;--line:#2c4450;--green:#4fd187;--gbg:#14402a;--abg:#4a3a0a;--mut:#9db4bf;--blue:#7cc4e4}}
:root[data-theme="dark"]{--bg:#0d1a21;--fg:#eef5f8;--card:#16272f;--line:#2c4450;--green:#4fd187;--gbg:#14402a;--abg:#4a3a0a;--mut:#9db4bf;--blue:#7cc4e4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif;font-size:24px;line-height:1.3;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:14px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gear{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:24px;color:var(--fg)}
button{font:inherit;cursor:pointer}
.steps{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex:1}
.dot{width:72px;height:72px;border-radius:50%;background:var(--card);border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--mut)}
.dot.now{border-color:var(--amber);background:var(--abg);color:var(--fg)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff;font-size:40px}
.main{flex:6;display:flex;flex-direction:column}
.card{background:var(--abg);border:6px solid var(--amber);border-radius:32px;padding:18px;text-align:center;animation:fl .8s steps(1) infinite}
@keyframes fl{50%{border-color:var(--red)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card .n{font-size:150px;font-weight:900;line-height:1}
.card .p{font-size:110px;line-height:1.1}
.card .t{font-size:34px;font-weight:900}
.wait{background:var(--card);border:4px solid var(--line);border-radius:32px;padding:26px;text-align:center}
.wait .ic{font-size:90px}
.wait .m{font-size:120px;font-weight:900;line-height:1}
.wait .u{font-size:32px;color:var(--mut)}
.go{display:block;width:100%;min-height:120px;border:0;border-radius:30px;background:var(--green);color:#fff;font-size:44px;font-weight:900;margin-top:16px}
.go:active{transform:scale(.97)}
.home{text-align:center;margin:auto 0}
.home .go{min-height:170px;font-size:60px;border-radius:50px}
.home .ic{font-size:110px}
.win{text-align:center;color:var(--green);font-size:44px;font-weight:900}
.win .ic{font-size:130px}
.rst{display:block;width:100%;margin-top:20px;min-height:56px;border-radius:16px;border:3px solid var(--red);background:transparent;color:var(--red);font-size:22px;font-weight:700}
.ask{margin-top:20px;border:3px solid var(--red);border-radius:20px;padding:12px;text-align:center;font-size:26px;font-weight:900}
.ask .go{min-height:84px;font-size:32px;margin-top:10px}
#set{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));display:none;z-index:5}
#set .in{max-width:520px;margin:0 auto}
.sm{padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:100%;margin-top:10px;font-size:22px}
</style>
</head>

function LOGO(s){return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#14506b"/><g transform="rotate(-35 50 50)"><rect x="18" y="35" width="64" height="30" rx="15" fill="#fff"/><path d="M50 35H67a15 15 0 0 1 0 30H50z" fill="#f2a900"/></g><circle cx="76" cy="76" r="15" fill="#1c8a4a"/><path d="M69 76l5 5 9-10" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
var GAP=[0,5,10,30],KIND=['m','m','m','eat'],ICON=['1','2','3','🍽️'];
var S={};try{S=JSON.parse(localStorage.getItem('pb'))||{}}catch(e){}
S.al=S.al||[];S.done=S.done||[];S.due=S.due||[];if(S.start&&!S.due.length)S.start=0;
function save(){try{localStorage.setItem('pb',JSON.stringify(S))}catch(e){}}
var AC=null,last='',lastRing=0,askReset=false,player=new Audio();
var SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA=';
function unlock(){try{if(!player.src){player.src=SIL;var q=player.play();if(q&&q.catch)q.catch(function(){})}}catch(e){}}
function say(k){try{player.src=REC[k];var p=player.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function ring(i){say(i);if(navigator.vibrate)navigator.vibrate([600,150,600]);try{if(window.Notification&&Notification.permission=='granted')new Notification(KIND[i]=='eat'?'حان وقت الأكل':'حان وقت الدواء رقم '+(i+1),{requireInteraction:true})}catch(e){}}
var wl=null;function wake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(S.start&&document.visibilityState=='visible')wake()});
function html(){
 var top='<div class="top">'+LOGO(52)+'<button class="gear" data-a="set" aria-label="إعدادات">⚙</button></div>';
 if(!S.start)return top+'<div class="home"><div class="ic">'+LOGO(150)+'</div><button class="go" data-a="start">▶ ابدأ</button></div>';
 var now=Date.now(),f=-1,dots='';
 for(var i=0;i<4;i++){if(!S.done[i]&&f<0)f=i}
 for(var i=0;i<4;i++){
  var c=S.done[i]?'dot ok':(i==f&&typeof S.due[i]=='number'&&now>=S.due[i]?'dot now':'dot');
  dots+='<div class="'+c+'">'+(S.done[i]?'✔':ICON[i])+'</div>';
 }
 var h=top+'<div class="steps">'+dots+'</div><div class="main">';
 if(f<0){h+='<div class="win"><div class="ic">🎉</div>أحسنتِ!</div><button class="go" style="background:var(--blue)" data-a="yes">✔ إنهاء</button>'}
 else{
  var due=S.due[f],eat=KIND[f]=='eat';
  if(typeof due=='number'&&now>=due){
   h+='<div class="card">'+(eat?'<div class="p">🍽️</div><div class="t">وقت الأكل</div>':'<div class="n">'+(f+1)+'</div><div class="p">💊</div><div class="t">الدواء رقم '+(f+1)+'</div>')+'</div><button class="go" data-a="ok" data-i="'+f+'">✔ '+(eat?'أنا آكل':'أخذته')+'</button>';
  }else{
   var m=Math.max(1,Math.ceil((due-now)/60000));
   h+='<div class="wait"><div class="ic">⏳</div><div class="m">'+m+'</div><div class="u">دقيقة</div></div>';
  }
 }
 h+='</div>';
 if(askReset)h+='<div class="ask">↺ إعادة من البداية؟<button class="go" style="background:var(--red)" data-a="yes">✔ نعم</button><button class="go" style="background:var(--blue)" data-a="no">✖ لا</button></div>';
 else if(f>=0)h+='<button class="rst" data-a="reset">↺ إعادة</button>';
 return h;
}
function render(){var h=html();if(h!==last){last=h;document.getElementById('app').innerHTML=h}}
function tick(){
 if(S.start){var now=Date.now(),first=-1;
  for(var i=0;i<4;i++){if(!S.done[i]){if(typeof S.due[i]=='number'&&now>=S.due[i])first=i;break}}
  if(first>=0&&now-lastRing>=5000){lastRing=now;S.al[first]=1;save();ring(first)}}
 if(document.getElementById('set').style.display!='block')render();
}
setInterval(tick,1000);
document.addEventListener('click',unlock,true);
function doReset(){askReset=false;try{player.pause()}catch(e){}S.start=0;S.due=[];S.done=[];S.al=[];lastRing=0;save();last='';render()}
document.getElementById('app').addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
 if(a=='set')openSet();
 if(a=='start'){unlock();wake();try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(x){}S.start=Date.now();S.due=[S.start];S.done=[];S.al=[];lastRing=Date.now();save();last='';render();ring(0)}
 if(a=='ok'){var i=+b.dataset.i;try{player.pause()}catch(x){}S.done[i]=true;if(i<3)S.due[i+1]=Date.now()+GAP[i+1]*60000;lastRing=0;save();last='';render()}
 if(a=='reset'){askReset=true;last='';render()}
 if(a=='no'){askReset=false;last='';render()}
 if(a=='yes')doReset();
});
function openSet(){
 var el=document.getElementById('set');
 el.innerHTML='<div class="in"><h1>⚙</h1><button class="sm" id="tv">🔊 جرّب الصوت</button>'+(S.start?'<button class="sm" id="stp">↺ إعادة من البداية</button>':'')+'<button class="go" style="background:var(--blue)" id="cl">إغلاق</button></div>';
 el.style.display='block';
 document.getElementById('tv').onclick=function(){unlock();ring(0)};
 var s=document.getElementById('stp');if(s)s.onclick=function(){doReset();el.style.display='none'};
 document.getElementById('cl').onclick=function(){el.style.display='none';last='';render()};
}

render();if(S.start)wake();
